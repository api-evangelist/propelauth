openapi: 3.2.0
info:
  title: PropelAuth MCP Authentication Metadata API
  description: 'OAuth 2.1 authorization server endpoints PropelAuth exposes for Model Context Protocol

    (MCP) clients and AI agents. Includes dynamic client registration (RFC 7591), token

    introspection, and the OAuth 2.1 authorization server metadata endpoint. Use this to

    secure MCP servers with PropelAuth identities and organization-scoped permissions.'
  version: 1.0.0
  contact:
    name: PropelAuth Support
    url: https://www.propelauth.com
    email: support@propelauth.com
  license:
    name: PropelAuth Terms
    url: https://www.propelauth.com/legal/terms-of-service
servers:
- url: https://auth.example.com
  description: Your PropelAuth Auth URL
tags:
- name: Metadata
  description: Authorization server metadata discovery
paths:
  /.well-known/oauth-authorization-server/oauth/2.1:
    get:
      summary: OAuth 2.1 Authorization Server Metadata
      description: 'OAuth 2.1 authorization server metadata document, including supported scopes, grant

        types, response types, and PKCE methods.'
      operationId: mcpAuthServerMetadata
      tags:
      - Metadata
      responses:
        '200':
          description: Metadata document
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    format: uri
                  authorization_endpoint:
                    type: string
                    format: uri
                  token_endpoint:
                    type: string
                    format: uri
                  introspection_endpoint:
                    type: string
                    format: uri
                  registration_endpoint:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string
                  code_challenge_methods_supported:
                    type: array
                    items:
                      type: string
